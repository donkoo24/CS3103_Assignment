name: LiveRecall CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test-and-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          python -m pytest -q
          # node --test client/tests/ # Uncomment when JS tests are added

      - name: Check Start Path Compatibility
        run: python submission_check.py

      - name: T1 Smoke Test
        run: python run_demo.py --clients 20 --duration 20 --runs 1 --quiet-server --output-stem ci_t1

      - name: Gate Check
        run: python scripts/check_results.py ci_t1.json --profile t1